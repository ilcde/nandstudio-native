name: Native build checks (not release certification)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, qt_host: windows, qt_arch: win64_msvc2022_64, kit: msvc2022_64}
          - {os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, kit: gcc_64}
          - {os: macos-14, qt_host: mac, qt_arch: clang_64, kit: macos}
          - {os: macos-15-intel, qt_host: mac, qt_arch: clang_64, kit: macos}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11.6'}
      - name: Install pinned build tools
        run: python -m pip install aqtinstall==3.3.0 cmake==3.30.5 ninja==1.13.2
      - name: Install Qt
        if: runner.os != 'Windows'
        run: python scripts/install-qt.py install-qt ${{ matrix.qt_host }} desktop 6.11.1 ${{ matrix.qt_arch }} -O Qt
      - name: Install Qt with native Windows archive extraction
        if: runner.os == 'Windows'
        run: python scripts/install-qt.py --config scripts/aqt-windows.ini install-qt windows desktop 6.11.1 win64_msvc2022_64 -O Qt --external "C:/Program Files/7-Zip/7z.exe"
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
          "$pwd/Qt/6.11.1/msvc2022_64/bin" >> $env:GITHUB_PATH
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libegl1 libopengl0 xvfb
      - name: Configure
        run: cmake --preset desktop -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.11.1/${{ matrix.kit }}
      - run: cmake --build --preset desktop
      - run: ctest --preset desktop
      - run: python tests/test_release_staging.py
      - name: Deploy Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          ./scripts/package-windows.ps1 -BuildDirectory build -Destination dist/NandStudio-windows-x86_64 -QtRoot "$pwd/Qt/6.11.1/msvc2022_64" -CrtDirectory $crt
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_QUICK_BACKEND = 'software'
          $env:NAND_TEST_STATE_DIR = "$pwd/package-test/state"
          $app = Start-Process -FilePath "$pwd/dist/NandStudio-windows-x86_64/bin/NandStudio.exe" -ArgumentList '--self-test',('"{0}"' -f "$pwd/package-test") -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode) { throw "Packaged GUI tests failed: $($app.ExitCode)" }
      - name: Deploy and exercise outside build tree
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/package"
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software NAND_TEST_STATE_DIR="$PWD/package-test/state"
          if [ "${{ runner.os }}" = "macOS" ]; then
            export QT_QPA_PLATFORM=cocoa
            cd package
            ./NandStudio.app/Contents/MacOS/NandStudio --self-test "$GITHUB_WORKSPACE/package-test"
            cd ..
            hdiutil create -volname NandStudio -srcfolder package -ov -format UDZO NandStudio-${{ matrix.os }}.dmg
            otool -L package/NandStudio.app/Contents/MacOS/NandStudio > package-test/dependencies.txt
          else
            python scripts/package-linux.py "$PWD/Qt/6.11.1/gcc_64" "$PWD/package"
            cd /tmp
            "$GITHUB_WORKSPACE/package/NandStudio.sh" --self-test "$GITHUB_WORKSPACE/package-test"
            QT_QPA_PLATFORM=xcb NAND_TEST_STATE_DIR="$GITHUB_WORKSPACE/package-xcb/state" xvfb-run -a "$GITHUB_WORKSPACE/package/NandStudio.sh" --self-test "$GITHUB_WORKSPACE/package-xcb"
            cd "$GITHUB_WORKSPACE"
            ldd package/bin/NandStudio > package-test/dependencies.txt
            readelf -d package/bin/NandStudio > package-test/dynamic.txt
            tar -cJf NandStudio-linux-x86_64.tar.xz -C package .
          fi
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/gui-test/checks.json
            build/gui-test/*.png
            build/gui-test/dialog-overflow.json
            build/gui-test/state/qt.log
            package-test/
            package-xcb/
            NandStudio-*.dmg
            NandStudio-*.tar.xz
            dist/NandStudio-windows-x86_64.zip
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, kit: android_arm64_v8a}
          - {abi: x86_64, kit: android_x86_64}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11.6'}
      - uses: actions/setup-java@v4.7.1
        with: {distribution: temurin, java-version: '21.0.7'}
      - run: python -m pip install aqtinstall==3.3.0 cmake==3.30.5 ninja==1.13.2
      - run: python scripts/install-qt.py install-qt linux desktop 6.11.1 linux_gcc_64 -O Qt
      - run: python scripts/install-qt.py install-qt linux android 6.11.1 ${{ matrix.kit }} -O Qt
      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Compile development packages
        env:
          QT_HOST_PATH: ${{ github.workspace }}/Qt/6.11.1/gcc_64
          QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/6.11.1/${{ matrix.kit }}
        run: sh scripts/build-android.sh ${{ matrix.abi }}
      - name: Verify APK native alignment
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            python scripts/check_android_package.py "$apk"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          done < <(find build-android-${{ matrix.abi }} -name '*.apk' -print0)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify build-android-${{ matrix.abi }}/android-build/build/outputs/apk/debug/android-build-debug.apk
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-development-${{ matrix.abi }}
          path: |
            build-android-${{ matrix.abi }}/**/*.apk
            build-android-${{ matrix.abi }}/**/*.aab
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - run: cmake --preset asan && cmake --build --preset asan && ctest --preset asan
